name: Build iOS IPA (unsigned, for sideload)

on:
  workflow_dispatch:
    inputs:
      configuration:
        description: "Debug = dev build (live reload from laptop) · Release = standalone app"
        type: choice
        options: [Debug, Release]
        default: Debug

jobs:
  build:
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Install JS dependencies
        run: npm ci

      - name: Generate native iOS project
        run: npx expo prebuild --platform ios --clean --no-install

      - name: Install CocoaPods
        run: cd ios && pod install

      - name: Build .app without code signing
        run: |
          WS=$(ls -d ios/*.xcworkspace | head -1)
          SCHEME=$(basename "$WS" .xcworkspace)
          echo "Workspace: $WS  Scheme: $SCHEME"
          xcodebuild \
            -workspace "$WS" \
            -scheme "$SCHEME" \
            -configuration "${{ inputs.configuration }}" \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build | tail -n 200

      - name: Package .ipa
        run: |
          mkdir -p Payload
          cp -R build/Build/Products/${{ inputs.configuration }}-iphoneos/*.app Payload/
          zip -qry "khien-${{ inputs.configuration }}-unsigned.ipa" Payload

      - uses: actions/upload-artifact@v4
        with:
          name: khien-${{ inputs.configuration }}-ipa
          path: khien-${{ inputs.configuration }}-unsigned.ipa
          retention-days: 14
