# Build bản Release (chạy độc lập, không cần laptop) để ký bằng Sideloadly/ESign rồi cài lên iPhone.
# Chạy tay: tab Actions -> "Build iOS IPA" -> Run workflow. Xong thì tải file ở mục "Artifacts" cuối trang.
# Code JS thay đổi sau này không cần build lại: dùng `npx eas-cli@latest update --channel production`.
# Chỉ build lại khi thêm thư viện native hoặc đổi app.json (nhớ tăng "version" khi đó).
name: Build iOS IPA (Release, unsigned)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Check EAS Update config
        run: |
          node -e '
            const e = require("./app.json").expo;
            const url = e.updates && e.updates.url;
            if (!url) {
              console.error("::error::app.json chưa có updates.url → app build ra sẽ KHÔNG nhận được cập nhật qua mạng. Chạy `npx eas-cli@latest update:configure` trước rồi push lại.");
              process.exit(1);
            }
            console.log("updates.url:", url, "| runtimeVersion:", JSON.stringify(e.runtimeVersion), "| version:", e.version);
          '

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Install JS dependencies
        run: npm ci

      - name: Generate native iOS project
        run: npx expo prebuild --platform ios --clean --no-install

      - name: Install CocoaPods
        run: cd ios && pod install

      - name: Build Release .app without code signing
        run: |
          set -o pipefail
          WS=$(ls -d ios/*.xcworkspace | head -1)
          SCHEME=$(basename "$WS" .xcworkspace)
          echo "Workspace: $WS  Scheme: $SCHEME"
          xcodebuild \
            -workspace "$WS" \
            -scheme "$SCHEME" \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build | tail -n 200

      - name: Package .ipa
        run: |
          mkdir -p Payload
          cp -R build/Build/Products/Release-iphoneos/*.app Payload/
          VERSION=$(node -p 'require("./app.json").expo.version')
          zip -qry "Ryx-${VERSION}-unsigned.ipa" Payload
          echo "IPA_NAME=Ryx-${VERSION}-unsigned.ipa" >> "$GITHUB_ENV"

      - uses: actions/upload-artifact@v4
        with:
          name: Ryx-ios-release
          path: ${{ env.IPA_NAME }}
          retention-days: 30
